<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music eval listening report</title>
<style>
:root{color-scheme:dark;--bg:#10171b;--surface:#1a2529;--ink:#f3f0e9;--muted:#aab9ba;--line:#344449;--accent:#eac38a;--good:#a9d8b3;--bad:#f1aaa5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif}main{max-width:1200px;margin:auto;padding:32px 20px 80px}h1{font-size:clamp(28px,4vw,44px);line-height:1.1;margin:0 0 12px}h2{font-size:24px;margin:42px 0 15px}h3{font-size:19px;margin:0 0 8px}p{margin:8px 0;color:var(--muted)}strong{color:var(--ink)}header{border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-size:12px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}button,.button{background:var(--accent);color:#1b1711;border:0;border-radius:8px;padding:9px 14px;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#344449;color:var(--ink)}input[type=file]{max-width:230px}.notice{padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:20px}.case{margin-top:32px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin:16px 0}.case-head{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--muted);font-size:12px}.players{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}.player{border:1px solid var(--line);border-radius:10px;padding:16px}.player h4{margin:0 0 9px}.player audio{width:100%}.votes{display:grid;grid-template-columns:1fr 1fr;gap:16px}.vote-block{border-top:1px solid var(--line);padding-top:12px}.vote-block legend{font-weight:650;margin-bottom:6px}.vote-block label{display:inline-flex;align-items:center;gap:3px;margin:5px 12px 5px 0;white-space:nowrap}.rubric{font-size:13px}.status{font-size:13px;color:var(--accent)}.hidden{display:none!important}.table-wrap{overflow:auto;margin:12px 0 24px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}th{color:var(--accent);font-weight:650;white-space:nowrap}td{color:var(--ink)}.good{color:var(--good)}.bad{color:var(--bad)}code{font-size:12px}small{color:var(--muted)}@media(max-width:680px){.players,.votes{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header><div class="eyebrow">Music generator SDK · Blind listening eval</div><h1>Listen first. Reveal later.</h1><p id="run-label"></p><p>Compare each pair on background-music quality and prompt adherence separately. Left and right are randomized for every pair. Tie and skip are valid votes.</p><div class="controls"><button id="export">Export raw votes</button><label class="button secondary" for="import">Import votes</label><input class="hidden" id="import" type="file" accept="application/json"><button id="reveal" class="secondary" disabled>Reveal models and results</button></div><div class="notice" id="progress"></div></header>
<section id="listening"><h2>Blind comparisons</h2><div id="pairs"></div></section>
<section id="revealed" class="hidden"><h2>Aggregate results</h2><div id="aggregate"></div><h2>Per-prompt results</h2><div id="per-prompt"></div></section>
</main>
<script>
/*__EVAL_DATA__*/
const storeKey = `music-eval-votes:${DATA.runId}`;
let votes = JSON.parse(localStorage.getItem(storeKey) || '[]');
let revealed = localStorage.getItem(`${storeKey}:revealed`) === 'true';
const byId = id => document.getElementById(id);
const el = (tag, text, cls) => { const node=document.createElement(tag); if(text!==undefined)node.textContent=String(text); if(cls)node.className=cls; return node; };
const fmt = (value,digits=1) => value==null ? '—' : Number(value).toFixed(digits);
const categoryNames = { quality:'Background-music quality', adherence:'Prompt adherence' };
const choices = ['left','right','tie','skip'];
const pairById = Object.fromEntries(DATA.pairs.map(p=>[p.pairId,p]));
function save(){localStorage.setItem(storeKey,JSON.stringify(votes));updateProgress();if(revealed)renderResults();}
function voteFor(pairId,category){return votes.find(v=>v.pairId===pairId&&v.category===category);}
function complete(){return DATA.pairs.every(p=>voteFor(p.pairId,'quality')&&voteFor(p.pairId,'adherence'));}
function updateProgress(){const done=DATA.pairs.reduce((n,p)=>n+Number(!!voteFor(p.pairId,'quality'))+Number(!!voteFor(p.pairId,'adherence')),0),total=DATA.pairs.length*2;byId('progress').textContent=DATA.pairs.length?`${done}/${total} category votes recorded across ${DATA.pairs.length} audio pairs. Votes stay in this browser until exported.`:'No playable model pairs were produced. Objective results can be revealed now.';byId('reveal').disabled=!complete();}
function renderPairs(){const host=byId('pairs');host.replaceChildren();if(!DATA.pairs.length){host.append(el('p','No successful matched pairs are available for blind listening.'));return;}for(const pair of DATA.pairs){const c=DATA.cases.find(x=>x.id===pair.caseId);const card=el('article',undefined,'card');const head=el('div',undefined,'case-head');const heading=el('div');heading.append(el('h3',`${c.id} · sample ${pair.sampleIndex}`),el('p',c.prompt));head.append(heading);const tags=el('div',undefined,'tags');for(const tag of c.tags)tags.append(el('span',tag,'tag'));head.append(tags);card.append(head,el('p',`Listening rubric: ${c.listeningRubric}`,'rubric'));const players=el('div',undefined,'players');for(const side of ['left','right']){const box=el('div',undefined,'player');box.append(el('h4',side==='left'?'Left audio':'Right audio'));const audio=el('audio');audio.controls=true;audio.preload='none';audio.src=pair[side].audio;box.append(audio);players.append(box);}card.append(players);const forms=el('div',undefined,'votes');for(const category of ['quality','adherence']){const field=el('fieldset',undefined,'vote-block');field.style.border='0';field.style.margin='0';field.style.paddingLeft='0';const legend=el('legend',categoryNames[category]);field.append(legend);for(const choice of choices){const label=el('label');const input=el('input');input.type='radio';input.name=`${pair.pairId}-${category}`;input.value=choice;input.checked=voteFor(pair.pairId,category)?.choice===choice;input.addEventListener('change',()=>{votes=votes.filter(v=>!(v.pairId===pair.pairId&&v.category===category));votes.push({pairId:pair.pairId,caseId:pair.caseId,sampleIndex:pair.sampleIndex,category,choice,leftModelId:pair.left.modelId,rightModelId:pair.right.modelId,at:new Date().toISOString()});save();});label.append(input,el('span',choice[0].toUpperCase()+choice.slice(1)));field.append(label);}forms.append(field);}card.append(forms);host.append(card);}}
function voteStats(category,caseId){const ids=DATA.models;const stats=Object.fromEntries(ids.map(id=>[id,{wins:0,losses:0,ties:0,skips:0,judged:0}]));for(const v of votes.filter(x=>x.category===category&&(!caseId||x.caseId===caseId))){const p=pairById[v.pairId];if(!p)continue;const left=p.left.modelId,right=p.right.modelId;if(v.choice==='skip'){stats[left].skips++;stats[right].skips++;continue;}stats[left].judged++;stats[right].judged++;if(v.choice==='tie'){stats[left].ties++;stats[right].ties++;}else{const winner=v.choice==='left'?left:right,loser=v.choice==='left'?right:left;stats[winner].wins++;stats[loser].losses++;}}return stats;}
function elo(category){const judged=votes.filter(v=>v.category===category&&v.choice!=='skip'),decisive=judged.filter(v=>v.choice==='left'||v.choice==='right');const counts=voteStats(category);if(decisive.length<20||DATA.models.some(id=>counts[id].judged<10))return null;const ratings=Object.fromEntries(DATA.models.map(id=>[id,1500]));for(const v of judged){const p=pairById[v.pairId];if(!p)continue;const a=p.left.modelId,b=p.right.modelId;const expected=1/(1+10**((ratings[b]-ratings[a])/400));const actual=v.choice==='left'?1:v.choice==='right'?0:0.5;ratings[a]+=24*(actual-expected);ratings[b]+=24*((1-actual)-(1-expected));}return ratings;}
function table(headers,rows){const wrap=el('div',undefined,'table-wrap'),t=el('table'),thead=el('thead'),tr=el('tr');for(const h of headers)tr.append(el('th',h));thead.append(tr);t.append(thead);const body=el('tbody');for(const row of rows){const tr=el('tr');for(const cell of row)tr.append(el('td',cell));body.append(tr);}t.append(body);wrap.append(t);return wrap;}
function renderResults(){byId('revealed').classList.remove('hidden');const aggregate=byId('aggregate');aggregate.replaceChildren();const summary=DATA.summary?.overall;aggregate.append(el('p',`${summary?.successes??0}/${summary?.calls??0} successful generations · ${summary?.failures??0} failures · ${summary?.objectivePasses??0} objective passes. Estimated cost shown only where pricing was recorded.`));aggregate.append(table(['Model','Calls','Success','Failures','Objective pass','Median latency','Known cost'],DATA.models.map(id=>{const s=DATA.summary.byModel[id];const known=s.calls-s.costUnknownCalls;const cost=known?(s.costUnknownCalls?`$${fmt(s.knownEstimatedCostUsd,3)} + ${s.costUnknownCalls} unknown`:`$${fmt(s.knownEstimatedCostUsd,3)}`):'Unknown';return[id,s.calls,s.successes,s.failures,s.objectivePasses,s.medianLatencyMs==null?'—':`${fmt(s.medianLatencyMs/1000,1)} s`,cost]})));for(const category of ['quality','adherence']){const stats=voteStats(category),ratings=elo(category);aggregate.append(el('h3',categoryNames[category]));aggregate.append(table(['Model','Wins','Losses','Ties','Skips','Judged votes',ratings?'Elo':'Elo threshold'],DATA.models.map(id=>[id,stats[id].wins,stats[id].losses,stats[id].ties,stats[id].skips,stats[id].judged,ratings?fmt(ratings[id],0):'Needs ≥20 decisive votes and ≥10 judgments/model'])));aggregate.append(el('p',ratings?'Elo is provisional (K=24); compare it with vote counts.':'Raw wins are shown; the current sample is too small for Elo.'));}const promptHost=byId('per-prompt');promptHost.replaceChildren();for(const c of DATA.cases){const box=el('section',undefined,'case');box.append(el('h3',c.id),el('p',c.prompt),el('p',`Listening rubric: ${c.listeningRubric}`));const rows=DATA.results.filter(r=>r.caseId===c.id).map(r=>{const o=r.objective;return[r.modelId,`#${r.sampleIndex}`,r.status,r.status==='failure'?(r.error?.message??'failed'):(o?.passed?'pass':'issue')+(r.metadata?.scoreExpansion&&(r.metadata.scoreExpansion.truncatedNotes||r.metadata.scoreExpansion.droppedNotes)?` · ${r.metadata.scoreExpansion.truncatedNotes} trimmed, ${r.metadata.scoreExpansion.droppedNotes} dropped notes`:''),r.elapsedMs==null?'—':`${fmt(r.elapsedMs/1000,1)} s`,r.metadata?.noteCount??'—',o?.midi?.nonEmptyTracks??'—',o?.wav?`${fmt(o.wav.durationSeconds,3)} s`:'—',r.metadata?.tempoAdjustmentPercent==null?'—':`${fmt(r.metadata.tempoAdjustmentPercent,1)}%`,o?.checks?.midiEndpointDuration===undefined?'—':String(o.checks.midiEndpointDuration),r.planning?.firstProposalDurationSeconds==null?'—':`${fmt(r.planning.firstProposalDurationSeconds,2)} s`,r.planning?.revisionAttempts??'—',r.estimatedCost?`$${fmt(r.estimatedCost.usd,3)}`:'—'];});box.append(table(['Model','Sample','Generation','Objective','Latency','Notes','Tracks','WAV duration','Tempo correction','MIDI endpoint','First proposal','Revisions','Cost estimate'],rows));for(const category of ['quality','adherence']){const stats=voteStats(category,c.id);box.append(el('p',`${categoryNames[category]} votes: `+DATA.models.map(id=>`${id}: ${stats[id].wins} W / ${stats[id].losses} L / ${stats[id].ties} T (${stats[id].judged} judged)`).join(' · ')));}promptHost.append(box);}}
byId('export').addEventListener('click',()=>{const payload={formatVersion:1,runId:DATA.runId,suite:DATA.suite,exportedAt:new Date().toISOString(),votes};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=`music-eval-votes-${DATA.runId}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
byId('import').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;try{const payload=JSON.parse(await file.text());if(payload.runId!==DATA.runId||!Array.isArray(payload.votes))throw new Error('Vote file does not match this run');votes=payload.votes.filter(v=>pairById[v.pairId]&&['quality','adherence'].includes(v.category)&&choices.includes(v.choice));save();renderPairs();}catch(error){alert(String(error));}});
byId('reveal').addEventListener('click',()=>{if(!complete())return;revealed=true;localStorage.setItem(`${storeKey}:revealed`,'true');renderResults();byId('revealed').scrollIntoView({behavior:'smooth'});});
byId('run-label').textContent=`${DATA.suite.id} v${DATA.suite.version} · run ${DATA.runId} · ${DATA.models.length} models · ${DATA.cases.length} prompts · ${DATA.pairs.length} blind pairs`;
renderPairs();updateProgress();if(revealed&&complete())renderResults();
</script>
</body></html>
